<!-- TODO: check if chip changes when session type changes -->
<div id="timer-container">
  <div id="timer-number-group">
    <div id="timer-meta-container">
      <div
        id="session-type-container"
        [class.is-visible]="isTimerRunning() === true || isTimerPaused() === true"
        [attr.aria-hidden]="isTimerRunning() !== true && isTimerPaused() !== true"
        [attr.inert]="isTimerRunning() === true || isTimerPaused() === true ? null : ''"
      >
        <ion-text color="focus">{{ currentTimerSessionText }}</ion-text>
      </div>
    </div>

    <div>
      <p id="timer-numbers">
        @if (hours() >= 1) {
          <span>{{ hours() | twoDigits }}</span>
          <span>:</span>
        }
        <span>{{ minutes() | twoDigits }}</span>
        <span>:</span>
        <span>{{ seconds() | twoDigits }}</span>
      </p>
      <div id="label-container">
        @if (hours() >= 1) {
          <div>hr</div>
        }
        <div>min</div>
        <div>sec</div>
      </div>
    </div>
  </div>
</div>
