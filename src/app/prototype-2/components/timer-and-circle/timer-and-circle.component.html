<div id="timer-and-circle-container">
  <app-circle [totalSeconds]="totalSeconds()" [isTimerBeingEdited]="isTimerBeingEdited() === true"></app-circle>

  <app-timer
    [totalSeconds]="totalSeconds()"
    [class.is-visible]="isTimerBeingEdited() !== true"
    [attr.aria-hidden]="isTimerBeingEdited() === true"
    [attr.inert]="isTimerBeingEdited() === true ? '' : null"
  ></app-timer>

  <div style="z-index: 0; text-align: center">
    <!-- TODO: add ion-chip -->
    <p>{{ currentTimerSessionText() }}</p>
  </div>

  <app-edit-button
    [class.is-editing]="isTimerBeingEdited() === true"
    [attr.aria-hidden]="isTimerBeingEdited() === true"
    [attr.inert]="isTimerBeingEdited() === true ? '' : null"
  ></app-edit-button>

  <app-timer-edit
    [class.is-visible]="isTimerBeingEdited() === true"
    [attr.aria-hidden]="isTimerBeingEdited() !== true"
    [attr.inert]="isTimerBeingEdited() === true ? null : ''"
  ></app-timer-edit>
</div>
