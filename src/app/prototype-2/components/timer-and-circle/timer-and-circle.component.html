<div id="timer-and-circle-container">
  <app-circle
    [totalSeconds]="totalSeconds()"
    [isTimerBeingEdited]="isTimerBeingEdited() === true"
    [currentTimerSession]="currentTimerSession()"
    [isTimerRunning]="isTimerRunning()"
    [isTimerPaused]="isTimerPaused()"
  ></app-circle>

  <app-alarm
    [currentTimerSession]="currentTimerSession()"
    [class.is-visible]="isTimerRunning() === true || isTimerPaused() === true"
    [attr.aria-hidden]="isTimerRunning() !== true && isTimerPaused() !== true"
    [attr.inert]="isTimerRunning() === true || isTimerPaused() === true ? null : ''"
  ></app-alarm>

  <app-timer
    [totalSeconds]="totalSeconds()"
    [isTimerRunning]="isTimerRunning()"
    [isTimerPaused]="isTimerPaused()"
    [currentTimerSession]="currentTimerSession()"
    [class.is-visible]="isTimerBeingEdited() !== true"
    [attr.aria-hidden]="isTimerBeingEdited() === true"
    [attr.inert]="isTimerBeingEdited() === true ? '' : null"
  ></app-timer>

  <app-edit-button
    [class.is-editing]="isTimerBeingEdited() === true"
    [attr.aria-hidden]="isTimerBeingEdited() === true"
    [attr.inert]="isTimerBeingEdited() === true ? '' : null"
  ></app-edit-button>

  <app-timer-edit
    [class.is-visible]="isTimerBeingEdited() === true"
    [attr.aria-hidden]="isTimerBeingEdited() !== true"
    [attr.inert]="isTimerBeingEdited() === true ? null : ''"
  ></app-timer-edit>
</div>
