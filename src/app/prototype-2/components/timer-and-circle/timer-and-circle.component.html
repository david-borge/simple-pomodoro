<div id="timer-and-circle-container">
  <!-- TODO: move circle to separate component -->
  <div id="circle" #circleLocalRef>
    <div id="circle-inner"></div>
  </div>

  <div
    id="timer-container"
    [class.is-visible]="isTimerBeingEdited() !== true"
    [attr.aria-hidden]="isTimerBeingEdited() === true"
    [attr.inert]="isTimerBeingEdited() === true ? '' : null"
  >
    <div id="label-container">
      @if (hours() >= 1) {
        <div>hr</div>
      }
      <div>min</div>
      <div>sec</div>
    </div>
    <div>
      <p id="timer-numbers">
        @if (hours() >= 1) {
          <span>{{ hours() | twoDigits }}</span>
          <span>:</span>
        }
        <span>{{ minutes() | twoDigits }}</span>
        <span>:</span>
        <span>{{ seconds() | twoDigits }}</span>
      </p>
    </div>
  </div>

  <app-edit-button
    [class.is-editing]="isTimerBeingEdited() === true"
    [attr.aria-hidden]="isTimerBeingEdited() === true"
    [attr.inert]="isTimerBeingEdited() === true ? '' : null"
  ></app-edit-button>

  <app-timer-edit
    [class.is-visible]="isTimerBeingEdited() === true"
    [attr.aria-hidden]="isTimerBeingEdited() !== true"
    [attr.inert]="isTimerBeingEdited() === true ? null : ''"
  ></app-timer-edit>
</div>
