<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title>
      <h1 class="ion-text-center">Simple Pomodoro</h1>
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="container expand-main-content">
    <div id="main-content">
      <div class="center-content-horizontally center-content-vertically" style="width: 100%; flex-direction: column">
        <div class="center-content-horizontally center-content-vertically" style="width: 100%">
          <app-timer-and-circle [totalSeconds]="totalSeconds()" [isTimerRunning]="timerService.isTimerRunning" />
        </div>
        <div [ngStyle]="{ visibility: showSessionInfo() ? 'visible' : 'hidden' }" style="margin-top: 50px">
          <app-sessions-info [totalSeconds]="totalSeconds()" [isTimerRunning]="timerService.isTimerRunning" />
        </div>
      </div>
    </div>
    <div id="bottom-content" class="center-content-horizontally">
      <div id="timer-controls-row" [class.has-cancel-button]="isCancelButtonVisible()">
        <div id="cancel-button-slot" [attr.aria-hidden]="!isCancelButtonVisible()">
          <ion-button
            (click)="onClickCancelBtn()"
            [disabled]="!isCancelButtonVisible()"
            color="danger"
            size="large"
            expand="block"
            >Cancel</ion-button
          >
        </div>

        <div id="start-pause-button-slot">
          <ion-button
            #startPauseBtnLocalRef
            (click)="onClickStartPauseBtn()"
            [color]="startPauseBtnColor()"
            size="large"
            expand="block"
            >{{ startPauseBtnText() }}</ion-button
          >
        </div>
      </div>
    </div>
  </div>
</ion-content>
