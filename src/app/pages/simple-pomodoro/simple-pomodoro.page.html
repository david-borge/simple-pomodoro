<ion-header [translucent]="true" class="ion-no-border">
  <div class="container">
    <h1 class="ion-text-center">Simple Pomodoro</h1>
  </div>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="container expand-main-content">
    <div id="main-content">
      <div class="center-horizontally center-vertically" style="height: 100%">
        <app-timer [totalSeconds]="totalSeconds()" [isTimerRunning]="!timerService.isTimerPaused"></app-timer>
      </div>
    </div>
    <div id="bottom-content">
      <div class="center-horizontally" style="gap: 30px">
        @if(timerService.isTimerPaused && !timerService.isTimerCancelled) {
        <ion-button (click)="onClickCancelBtn()" class="ion-text-uppercase" color="danger">Cancel</ion-button>
        }

        <ion-button (click)="onClickStartPauseBtn()" class="ion-text-uppercase" [color]="startPauseBtnColor()">
          {{ startPauseBtnText() }}
        </ion-button>
      </div>
    </div>
  </div>
</ion-content>
