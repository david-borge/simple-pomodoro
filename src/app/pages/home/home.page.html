<ion-header [translucent]="true">
  <div class="container">
    <h1 class="ion-text-center">Simple Pomodoro</h1>
  </div>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="container expand-main-content">
    <div id="main-content">
      <div class="center-horizontally center-vertically" style="height: 100%"><app-timer></app-timer></div>
    </div>
    <div id="bottom-content">
      <div class="center-horizontally">
        <ion-button (click)="onClickStartPauseBtn()" class="ion-text-uppercase">Start</ion-button>
      </div>
    </div>
  </div>
</ion-content>
