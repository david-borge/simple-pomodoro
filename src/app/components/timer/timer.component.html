@if (!isTimerBeingEdited()) {
  <div>
    <div id="label-container">
      @if (hours() >= 1) {
        <div>hr</div>
      }
      <div>min</div>
      <div>sec</div>
    </div>
    <div>
      <p id="timer">
        @if (hours() >= 1) {
          <span id="hours">{{ hours() | twoDigits }}</span>
          <span>:</span>
        }
        <span id="minutes">{{ minutes() | twoDigits }}</span>
        <span>:</span>
        <span id="seconds">{{ seconds() | twoDigits }}</span>
      </p>
    </div>
  </div>
  @if (!timerService.isTimerRunning && !isTimerBeingEdited() && !timerService.isTimerPaused) {
    <div class="center-horizontally" style="margin-top: 30px">
      <ion-button (click)="onClickEditBtn()" class="ion-text-uppercase" color="dark" fill="outline" size="small"
        >Edit</ion-button
      >
    </div>
  }
} @else {
  <app-timer-edit></app-timer-edit>
}
