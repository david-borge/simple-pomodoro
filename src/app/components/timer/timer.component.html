<div id="label-container">
  @if (hours() >= 1) {
    <div>hr</div>
  }
  <div>min</div>
  <div>sec</div>
</div>
<div>
  <p id="timer">
    @if (hours() >= 1) {
      <span id="hours">{{ hours() | twoDigits }}</span>
      <span>:</span>
    }
    <span id="minutes">{{ minutes() | twoDigits }}</span>
    <span>:</span>
    <span id="seconds">{{ seconds() | twoDigits }}</span>
  </p>
</div>
